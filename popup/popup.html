<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Key↑</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="brand">
        <img src="../assets/keyup-logo.svg" alt="Key↑" class="logo" />
      </h1>
      <p class="tagline" data-i18n="appTagline">Type. Power up. Repeat.</p>
    </header>

    <section class="theme-section">
      <div class="theme-options">
        <button class="theme-option" data-theme="fighting">
          <span class="theme-icon">🥊</span>
          <span class="theme-name" data-i18n="themeFighting">格闘ゲーム</span>
        </button>
        <button class="theme-option" data-theme="arcade" hidden>
          <span class="theme-icon">🕹️</span>
          <span class="theme-name" data-i18n="themeArcade">アーケード</span>
        </button>
      </div>
    </section>

    <hr />

    <section class="row">
      <label for="volume" data-i18n="volumeLabel">🔊 音量</label>
      <input id="volume" type="range" min="0" max="100" step="1" />
      <span id="volumeValue">70%</span>
    </section>

    <section class="row toggle">
      <label for="typingSE" data-i18n="typingSELabel">⌨️ タイピングSE</label>
      <input id="typingSE" type="checkbox" />
    </section>

    <section class="row toggle">
      <label for="clickSE" data-i18n="clickSELabel">🖱️ クリックSE</label>
      <input id="clickSE" type="checkbox" />
    </section>

    <section class="row toggle">
      <label for="invincibleBGM" data-i18n="invincibleBGMLabel">🎮 無敵BGM</label>
      <input id="invincibleBGM" type="checkbox" />
    </section>

    <hr />

    <details class="guide" id="guide">
      <summary data-i18n="guideTitle">🎵 サウンドガイド</summary>
      <div id="guideBody"></div>
    </details>

    <hr />

    <section class="stats">
      <div><span class="label" data-i18n="statsTodayTime">今日の無敵時間</span><span id="todayTime">0分</span></div>
      <div><span class="label" data-i18n="statsBestStreak">最高連続</span><span id="bestStreak">0秒</span></div>
    </section>

    <script src="../themes/fighting.js"></script>
    <script src="../themes/arcade.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
