<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Key↑</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>⚡ Key↑</h1>
      <p class="tagline">Type. Power up. Repeat.</p>
    </header>

    <section class="theme-section">
      <div class="theme-label">THEME</div>
      <div class="theme-options">
        <button class="theme-option" data-theme="fighting">
          <span class="theme-icon">🥊</span>
          <span class="theme-name">格闘ゲーム</span>
        </button>
        <button class="theme-option" data-theme="arcade">
          <span class="theme-icon">🕹️</span>
          <span class="theme-name">アーケード</span>
        </button>
      </div>
    </section>

    <hr />

    <section class="row">
      <label for="volume">🔊 音量</label>
      <input id="volume" type="range" min="0" max="100" step="1" />
      <span id="volumeValue">70%</span>
    </section>

    <section class="row toggle">
      <label for="typingSE">⌨️ タイピングSE</label>
      <input id="typingSE" type="checkbox" />
    </section>

    <section class="row toggle">
      <label for="clickSE">🖱️ クリックSE</label>
      <input id="clickSE" type="checkbox" />
    </section>

    <section class="row toggle">
      <label for="invincibleBGM">🎮 無敵BGM</label>
      <input id="invincibleBGM" type="checkbox" />
    </section>

    <hr />

    <section class="stats">
      <div><span class="label">今日の無敵時間</span><span id="todayTime">0分</span></div>
      <div><span class="label">最高連続</span><span id="bestStreak">0秒</span></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
